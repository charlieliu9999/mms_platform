# Phase C: 灰度部署 Nginx 配置
#
# 流量分流策略：
# - 默认 90% 流量 → 旧服务（210.12.11.251:50000）
# - 10% 流量 → 新服务（MMS:9100）
# - 可通过 Header 强制路由（X-Match-Service: new|old）
#
# 灰度比例调整：修改 split_clients 中的百分比

upstream match_service_old {
    server 210.12.11.251:50000;
    keepalive 32;
}

upstream match_service_new {
    server 127.0.0.1:9100;
    keepalive 32;
}

# 按客户端 IP 哈希分流（同一 IP 始终走同一服务，便于对比）
split_clients "${remote_addr}${http_user_agent}" $match_backend {
    10%     match_service_new;
    *       match_service_old;
}

server {
    listen 80;
    server_name match.example.com;

    # 访问日志（含分流标记，用于对比分析）
    access_log /var/log/nginx/match_canary.log combined;

    location /algorithm/standardCheck/ {
        # Header 强制路由（优先级高于 split_clients）
        set $backend $match_backend;
        if ($http_x_match_service = "new") {
            set $backend match_service_new;
        }
        if ($http_x_match_service = "old") {
            set $backend match_service_old;
        }

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 添加响应头标记实际使用的后端（便于排查）
        add_header X-Match-Backend $backend always;

        # 超时配置（旧服务较慢，给足时间）
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 新服务独有的 v1 API（不分流，直接走新服务）
    location /v1/ {
        proxy_pass http://match_service_new;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查（新服务）
    location /health {
        proxy_pass http://match_service_new/health;
        access_log off;
    }
}
