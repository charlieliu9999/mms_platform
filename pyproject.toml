[tool.poetry]
name = "medical-match-service"
version = "1.0.0"
description = "Independent medical imaging procedure-to-standard matching service"
authors = ["i-CDSS Team"]
packages = [{include = "match_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.104.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0"}
asyncpg = ">=0.29.0"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
pandas = ">=2.0"
jieba = ">=0.42"
httpx = ">=0.25.0"
redis = ">=5.0"
alembic = ">=1.13.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
requests = "^2.34.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
