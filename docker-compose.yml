version: "3.8"

services:
  match-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9100:9100"
    environment:
      - MATCH_SVC_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/acrac_prod
      - MATCH_SVC_REDIS_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      # slim 镜像无 curl，用 python 探测；真实路由为 /api/health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: acrac_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"

volumes:
  pgdata:
