# Alembic 配置 — match_service 独立迁移
#
# 数据库地址不在此硬编码：env.py 从 match_service.config.get_settings()
# 读取 DATABASE_URL（即 MATCH_SVC_DATABASE_URL 环境变量），
# 保证迁移与服务运行时连同一个库，避免两处配置漂移。

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os

# 迁移文件名带时间戳前缀，便于按时间排序阅读
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
